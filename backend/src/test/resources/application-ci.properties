# Exclusivo de pruebas. No se incorpora al JAR ni modifica la configuración local.
spring.datasource.url=${CI_DB_URL:jdbc:postgresql://127.0.0.1:35437/qa_notificaciones_mercado_pago}
spring.datasource.username=qa_ci
spring.datasource.password=clave-ficticia-exclusiva-ci
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
jwt.secret=secreto-ficticio-ci-con-mas-de-treinta-y-dos-caracteres

# Las pruebas usan mocks y PostgreSQL temporal; no servicios externos.
spring.mail.host=127.0.0.1
spring.mail.port=9
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
mercadopago.base-url=http://127.0.0.1:9
mercadopago.access-token=
mercadopago.back-url=http://127.0.0.1:9/retorno
mercadopago.webhook.secret=secreto-ficticio-webhook-ci
mercadopago.notificaciones.scheduler-habilitado=false
auditoria.pendientes.procesamiento-habilitado=false
recordatorios.tandas.scheduler-habilitado=false

# Algunas pruebas MVC habilitan DEBUG; no registrar cuerpos HTTP en las del cliente.
logging.level.org.springframework.web.client=INFO

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.default-schema=public
spring.flyway.clean-disabled=true
mismascotas.migraciones.adoptar-base-qa=false
