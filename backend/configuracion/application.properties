spring.application.name=backend
jwt.secret=${JWT_SECRET}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
jwt.access-token-expiration-minutes=${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
jwt.refresh-token-expiration-days=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:14}
jwt.pre-auth-expiration-minutes=${JWT_PRE_AUTH_EXPIRATION_MINUTES:10}
auth.codigo-verificacion.expiracion-minutos=${AUTH_CODIGO_VERIFICACION_EXPIRACION_MINUTOS:10}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

mercadopago.base-url=${MERCADOPAGO_BASE_URL:https://api.mercadopago.com}
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.back-url=${MERCADOPAGO_BACK_URL:}
mercadopago.webhook.secret=${MERCADOPAGO_WEBHOOK_SECRET:}

suscripciones.planes.premium-mensual.importe=${SUSCRIPCION_PREMIUM_MENSUAL_IMPORTE:4000}
suscripciones.planes.premium-mensual.moneda=${SUSCRIPCION_PREMIUM_MENSUAL_MONEDA:ARS}
suscripciones.planes.premium-mensual.frecuencia=${SUSCRIPCION_PREMIUM_MENSUAL_FRECUENCIA:1}
suscripciones.planes.premium-mensual.frecuencia-tipo=${SUSCRIPCION_PREMIUM_MENSUAL_FRECUENCIA_TIPO:months}
suscripciones.planes.premium-mensual.motivo=${SUSCRIPCION_PREMIUM_MENSUAL_MOTIVO:Plan Premium MisMascotas}
suscripciones.planes.premium-anual.importe=${SUSCRIPCION_PREMIUM_ANUAL_IMPORTE:40000}
suscripciones.planes.premium-anual.moneda=${SUSCRIPCION_PREMIUM_ANUAL_MONEDA:ARS}
suscripciones.planes.premium-anual.frecuencia=${SUSCRIPCION_PREMIUM_ANUAL_FRECUENCIA:12}
suscripciones.planes.premium-anual.frecuencia-tipo=${SUSCRIPCION_PREMIUM_ANUAL_FRECUENCIA_TIPO:months}
suscripciones.planes.premium-anual.motivo=${SUSCRIPCION_PREMIUM_ANUAL_MOTIVO:Plan Premium anual MisMascotas}

# QA habilita las migraciones explícitamente.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.default-schema=public
spring.flyway.clean-disabled=true
mismascotas.migraciones.adoptar-base-qa=${MIGRACIONES_ADOPTAR_BASE_QA:false}
