name: Backend - pruebas e imagen QA

on:
  push:
    branches: [backend]
    paths:
      - backend/**
      - DB/**
      - .github/workflows/backend-qa.yml
      - ci/**
      - docker/qa-db/**
  pull_request:
    branches: [backend]
    paths:
      - backend/**
      - DB/**
      - .github/workflows/backend-qa.yml
      - ci/**
      - docker/qa-db/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verificar:
    name: Pruebas con PostgreSQL aislado
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SPRING_PROFILES_ACTIVE: ci
      SPRING_CONFIG_LOCATION: classpath:/
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
      CI_DB_URL: jdbc:postgresql://127.0.0.1:35437/qa_notificaciones_mercado_pago
      QA_COBRO_DB_URL: jdbc:postgresql://127.0.0.1:35437/qa_notificaciones_mercado_pago
      QA_COBRO_DB_USERNAME: qa_ci
      QA_COBRO_DB_PASSWORD: clave-ficticia-exclusiva-ci
      RUN_POSTGRES_CICLO_IT: 'true'
      RUN_POSTGRES_MIGRACIONES_IT: 'true'
      RUN_POSTGRES_CONSULTA_IT: 'true'
    steps:
      - name: Descargar el código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Preparar Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Comprobar que la configuración empaquetada no contenga claves locales
        run: |
          python3 ci/verificar_configuracion.py
          mkdir -p backend/src/main/resources
          cp backend/configuracion/application.properties backend/src/main/resources/application.properties

      - name: Crear PostgreSQL temporal vacío para las migraciones
        run: docker compose -f ci/compose.yaml up -d --wait --wait-timeout 120

      - name: Ejecutar pruebas unitarias, HTTP, contexto y ciclo con PostgreSQL
        working-directory: backend
        # Cada clase tiene su propia JVM: las pruebas MVC no alteran el logging del cliente HTTP.
        run: bash mvnw -B -ntp -DreuseForks=false '-Dtest=*Tests,SuscripcionCicloPostgresIT,MigracionesPostgresIT,SuscripcionConsultaPostgresIT,SuscripcionCancelacionPostgresIT' verify

      - name: Preparar Docker Buildx para verificar las imágenes
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Construir el backend para la prueba de entrega
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          load: true
          tags: mismascotas-backend:verificacion
          cache-from: type=gha,scope=backend-qa
          cache-to: type=gha,mode=max,scope=backend-qa

      - name: Construir PostgreSQL con esquema actual y seed QA
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/qa-db/Dockerfile
          platforms: linux/amd64
          load: true
          tags: mismascotas-db-qa:verificacion
          cache-from: type=gha,scope=db-qa
          cache-to: type=gha,mode=max,scope=db-qa

      - name: Verificar el seed, el arranque y la persistencia de QA
        run: python3 ci/verificar_imagen_qa.py mismascotas-db-qa:verificacion mismascotas-backend:verificacion

      - name: Conservar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pruebas-backend-${{ github.sha }}
          path: backend/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Mostrar diagnóstico de PostgreSQL si falló la verificación
        if: failure()
        run: docker compose -f ci/compose.yaml logs --no-color --tail 80

      - name: Eliminar únicamente el entorno temporal de CI
        if: always()
        run: docker compose -f ci/compose.yaml down --volumes --remove-orphans

  publicar:
    name: Publicar imágenes de backend y DB en Docker Hub
    needs: verificar
    # Una PR o una ejecución manual desde otra rama nunca publica imágenes.
    if: github.ref == 'refs/heads/backend' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Descargar el código verificado
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validar la configuración de publicación
        env:
          DOCKERHUB_USUARIO: ${{ vars.DOCKERHUB_USUARIO }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USUARIO" || { echo 'Falta la variable DOCKERHUB_USUARIO del repositorio.'; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo 'Falta el secreto DOCKERHUB_TOKEN del repositorio.'; exit 1; }

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Autenticarse en Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ vars.DOCKERHUB_USUARIO }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar la versión verificada
        id: imagen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          # Esta primera etapa publica versiones por commit. La promoción del canal QA
          # se incorporará al verificar la actualización de bases existentes.
          tags: ${{ vars.DOCKERHUB_USUARIO }}/mismascotas-backend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend-qa
          cache-to: type=gha,mode=max,scope=backend-qa

      - name: Publicar PostgreSQL con esquema actual y seed QA
        id: imagen_db
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/qa-db/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ vars.DOCKERHUB_USUARIO }}/mismascotas-db-qa:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=db-qa
          cache-to: type=gha,mode=max,scope=db-qa

      - name: Registrar la imagen publicada
        env:
          REPOSITORIO_IMAGEN: ${{ vars.DOCKERHUB_USUARIO }}/mismascotas-backend
          REVISION: ${{ github.sha }}
          DIGEST: ${{ steps.imagen.outputs.digest }}
          REPOSITORIO_DB: ${{ vars.DOCKERHUB_USUARIO }}/mismascotas-db-qa
          DIGEST_DB: ${{ steps.imagen_db.outputs.digest }}
        run: |
          printf '### Imagen del backend\n\n%s:sha-%s\n\nDigest: %s\n\nLa actualización del paquete de QA y sus volúmenes existentes sigue pendiente.\n' "$REPOSITORIO_IMAGEN" "$REVISION" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf '\n### PostgreSQL QA\n\n%s:sha-%s\n\nDigest: %s\n\nBase V9 con seed qa-base-v2.\n' "$REPOSITORIO_DB" "$REVISION" "$DIGEST_DB" >> "$GITHUB_STEP_SUMMARY"
